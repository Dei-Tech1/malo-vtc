<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="MALO VTC, votre chauffeur privé à Paris et en Île-de-France. Réservez votre trajet en toute simplicité.">

  <title>MALO VTC | Chauffeur privé Paris & Île-de-France</title>

  <style>
    :root {
      --navy: #061426;
      --navy-soft: #10263e;
      --gold: #e6bd68;
      --gold-light: #ffe19b;
      --white: #ffffff;
      --muted: #c8d0d9;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .container {
      width: min(1240px, 92%);
      margin: auto;
    }

    /* PREMIUM HEADER */

    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: linear-gradient(
        to bottom,
        rgba(3, 12, 25, .96),
        rgba(3, 12, 25, .55),
        transparent
      );
    }

    .navbar {
      min-height: 105px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand img {
      width: 108px;
      height: 108px;
      object-fit: contain;
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links > a {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: color .3s;
    }

    .nav-links > a:hover,
    .nav-links > a.active {
      color: var(--gold);
    }

    .nav-links > a.active::after {
      content: "";
      display: block;
      height: 2px;
      margin-top: 6px;
      background: var(--gold);
    }

    /* LANGUAGE DROPDOWN */

    .language {
      position: relative;
    }

    .language-button {
      background: rgba(5, 17, 32, .8);
      border: 1px solid rgba(230, 189, 104, .65);
      border-radius: 30px;
      color: white;
      padding: 9px 15px;
      white-space: nowrap;
    }

    .language-menu {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 165px;
      padding: 8px;
      background: #0b1d32;
      border: 1px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,.35);
    }

    .language-menu.open {
      display: block;
    }

    .language-menu button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: transparent;
      text-align: left;
    }

    .language-menu button:hover {
      background: rgba(230, 189, 104, .15);
      color: var(--gold);
    }

    /* RESERVATION BUTTON */

    .nav-booking {
      border: 2px solid var(--gold);
      border-radius: 35px;
      padding: 12px 18px;
      color: var(--gold) !important;
      font-weight: 700;
      white-space: nowrap;
      transition: background .3s, color .3s;
    }

    .nav-booking:hover {
      background: var(--gold);
      color: var(--navy) !important;
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 13px;
      border-radius: 6px;
      font-size: 23px;
    }

    /* CINEMATIC HERO */

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(3, 14, 29, .96) 0%,
          rgba(3, 14, 29, .78) 45%,
          rgba(3, 14, 29, .25) 100%
        ),
        url("assets/malo-hero.jpg") center/cover no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 850px;
      height: 850px;
      top: -380px;
      left: -340px;
      border-radius: 50%;
      border: 2px solid rgba(230, 189, 104, .35);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: min(690px, 100%);
      padding: 160px 0 130px;
    }

    .hero-eyebrow {
      color: var(--gold-light);
      letter-spacing: 5px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(44px, 5.5vw, 78px);
      line-height: 1.1;
      letter-spacing: -2px;
      margin: 25px 0;
      font-weight: 800;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-tagline {
      font-size: clamp(15px, 1.8vw, 20px);
      color: #e1e5e9;
      margin: 28px 0;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 17px;
      margin-top: 35px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 26px;
      border-radius: 9px;
      font-weight: 800;
      transition: transform .3s, background .3s;
    }

    .btn:hover {
      transform: translateY(-4px);
    }

    .btn-gold {
      background: linear-gradient(
        135deg,
        #ffe19b,
        #dca93e
      );
      color: #061426;
    }

    .btn-outline {
      border: 1px solid var(--gold);
      color: white;
      background: rgba(5, 15, 30, .55);
    }

    /* MOBILE NAVIGATION */

    @media (max-width: 1100px) {
      .navbar {
        min-height: 88px;
      }

      .brand img {
        width: 82px;
        height: 82px;
      }

      .menu-toggle {
        display: block;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 88px;
        left: 0;
        right: 0;
        background: rgba(6, 20, 38, .98);
        padding: 25px 5%;
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
        border-bottom: 1px solid var(--gold);
      }

      .nav-links.open {
        display: flex;
      }

      .language-menu {
        position: static;
        margin-top: 10px;
      }

      .hero-content {
        padding-top: 160px;
      }
    }

    @media (max-width: 600px) {
      .hero {
        min-height: 760px;
        background-position: 60% center;
      }

      .hero-content {
        padding-top: 145px;
        padding-bottom: 90px;
      }

      .hero-eyebrow {
        font-size: 10px;
        letter-spacing: 3px;
      }

      .hero h1 {
        letter-spacing: -1px;
      }

      .hero-actions {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

  <!-- PREMIUM NAVIGATION -->

  <header class="site-header">
    <div class="container navbar">

      <a href="index.html" class="brand"
         aria-label="MALO VTC - Accueil">
        <img src="assets/malo-logo.png"
             alt="MALO VTC - Chauffeur privé">
      </a>

      <button class="menu-toggle"
              id="menuToggle"
              type="button"
              aria-label="Ouvrir le menu"
              aria-expanded="false"
              aria-controls="navLinks">
        ☰
      </button>

      <nav class="nav-links" id="navLinks"
           aria-label="Navigation principale">

        <a href="index.html" class="active"
           data-fr="Accueil"
           data-en="Home">
          Accueil
        </a>

        <a href="services.html"
           data-fr="Nos Services"
           data-en="Our Services">
          Nos Services
        </a>

        <a href="index.html#apropos"
           data-fr="À propos"
           data-en="About Us">
          À propos
        </a>

        <a href="services.html#tarifs"
           data-fr="Tarifs"
           data-en="Pricing">
          Tarifs
        </a>

        <a href="reservation.html"
           data-fr="Contact"
           data-en="Contact">
          Contact
        </a>

        <div class="language">
          <button class="language-button"
                  id="languageButton"
                  type="button"
                  aria-expanded="false"
                  aria-controls="languageMenu">
            🇫🇷 FR ▾
          </button>

          <div class="language-menu"
               id="languageMenu">
            <button type="button" data-lang="fr">
              🇫🇷 Français
            </button>

            <button type="button" data-lang="en">
              🇬🇧 English
            </button>
          </div>
        </div>

        <a href="reservation.html"
           class="nav-booking"
           data-fr="Réserver maintenant"
           data-en="Book Now">
          ◉ Réserver maintenant
        </a>

      </nav>
    </div>
  </header>

  <!-- CINEMATIC HOMEPAGE HERO -->

  <main>
    <section class="hero" id="accueil">
      <div class="container">

        <div class="hero-content">

          <div class="hero-eyebrow"
               data-fr="CHAUFFEUR VTC — PARIS / ÎLE-DE-FRANCE"
               data-en="PRIVATE CHAUFFEUR — PARIS / ÎLE-DE-FRANCE">
            CHAUFFEUR VTC — PARIS / ÎLE-DE-FRANCE
          </div>

          <h1
            data-fr="Votre chauffeur privé<br>en &lt;span&gt;Île-de-France&lt;/span&gt;"
            data-en="Your private chauffeur<br>in &lt;span&gt;Île-de-France&lt;/span&gt;">
            Votre chauffeur privé<br>
            en <span>Île-de-France</span>
          </h1>

          <p class="hero-tagline"
             data-fr="Confort • Ponctualité • Sécurité • Discrétion"
             data-en="Comfort • Punctuality • Safety • Discretion">
            Confort • Ponctualité • Sécurité • Discrétion
          </p>

          <div class="hero-actions">

            <a href="reservation.html"
               class="btn btn-gold"
               data-fr="Réserver un trajet"
               data-en="Book a Journey">
              Réserver un trajet
            </a>

            <a href="services.html"
               class="btn btn-outline"
               data-fr="Notre service"
               data-en="Our Services">
              Notre service
            </a>

          </div>
        </div>

      </div>
    </section>
