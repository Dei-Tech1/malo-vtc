
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Découvrez les services de chauffeur privé MALO VTC à Paris et en Île-de-France.">
  <title>Nos Services | MALO VTC</title>

  <style>
    :root {
      --navy: #081726;
      --navy-light: #11273a;
      --gold: #d7b878;
      --white: #f8f5ee;
      --muted: #b9c2ca;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; }

    .container {
      width: min(1160px, 90%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 23, 38, .96);
      border-bottom: 1px solid rgba(215, 184, 120, .2);
      backdrop-filter: blur(12px);
    }

    .nav {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .brand span { color: var(--gold); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 600;
      transition: color .25s;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--gold); }

    .lang-btn, .menu-btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 5px;
      padding: 9px 13px;
      cursor: pointer;
      font-weight: 700;
    }

    .menu-btn { display: none; }

    .hero {
      min-height: 72vh;
      display: flex;
      align-items: center;
      position: relative;
      background:
        linear-gradient(90deg,
          rgba(8,23,38,.94),
          rgba(8,23,38,.65),
          rgba(8,23,38,.3)),
        url("assets/services-hero.jpg") center/cover;
    }

    .hero-content {
      max-width: 720px;
      padding: 100px 0;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    h1, h2, h3 {
      line-height: 1.2;
      margin-top: 0;
    }

    h1 {
      font-size: clamp(42px, 6vw, 78px);
      margin: 22px 0;
      letter-spacing: -2px;
    }

    h1 span, h2 span { color: var(--gold); }

    .hero p {
      max-width: 570px;
      color: #e0e3e5;
      font-size: 17px;
    }

    .btn {
      display: inline-block;
      padding: 15px 28px;
      background: var(--gold);
      color: var(--navy);
      font-weight: 800;
      border-radius: 4px;
      margin-top: 22px;
      transition: transform .25s, background .25s;
    }

    .btn:hover {
      transform: translateY(-3px);
      background: #efd49d;
    }

    .section { padding: 100px 0; }

    .section-heading {
      max-width: 720px;
      margin: 0 auto 55px;
      text-align: center;
    }

    .section-heading h2 {
      font-size: clamp(32px, 4vw, 48px);
      margin: 15px 0;
    }

    .section-heading p { color: var(--muted); }

    @media (max-width: 800px) {
      .nav { min-height: 72px; }

      .menu-btn { display: block; }

      .nav-links {
        display: none;
        position: absolute;
        top: 72px;
        left: 0;
        right: 0;
        background: var(--navy);
        padding: 24px 5%;
        flex-direction: column;
        align-items: stretch;
        border-bottom: 1px solid var(--gold);
      }

      .nav-links.open { display: flex; }

      .hero { min-height: 65vh; }

      .hero-content { padding: 75px 0; }

      .section { padding: 70px 0; }
    }
  </style>
</head>

<body>
  <header>
    <nav class="nav container">
      <a href="index.html" class="brand">MALO <span>VTC</span></a>

      <button class="menu-btn" id="menuBtn"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="navLinks">☰</button>

      <div class="nav-links" id="navLinks">
        <a href="index.html" data-fr="Accueil" data-en="Home">Accueil</a>
        <a href="services.html" class="active"
          data-fr="Nos Services" data-en="Our Services">Nos Services</a>
        <a href="reservation.html"
          data-fr="Réservation" data-en="Booking">Réservation</a>
        <button class="lang-btn" id="langBtn" type="button">EN</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-content">
          <div class="eyebrow"
            data-fr="MALO VTC • PARIS"
            data-en="MALO VTC • PARIS">MALO VTC • PARIS</div>

          <h1
            data-fr="L'art du voyage, &lt;span&gt;à votre service.&lt;/span&gt;"
            data-en="The art of travel, &lt;span&gt;at your service.&lt;/span&gt;">
            L'art du voyage, <span>à votre service.</span>
          </h1>

          <p
            data-fr="Découvrez une expérience de transport privé pensée pour vos déplacements, avec élégance et simplicité."
            data-en="Discover a private transport experience designed for your journeys, with elegance and simplicity.">
            Découvrez une expérience de transport privé pensée pour vos déplacements, avec élégance et simplicité.
          </p>

          <a class="btn" href="reservation.html"
            data-fr="Réserver votre chauffeur"
            data-en="Book your chauffeur">
            Réserver votre chauffeur
          </a>
        </div>
      </div>
            </section>
